# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: functions-agent-sql-mcp
metadata:
  template: functions-agent-sql-mcp@1.0.0
services:
  api:
    project: ./
    host: function
    language: python
hooks:
  prepackage:
    posix:
      shell: sh
      run: npm install --os=linux --cpu=x64 --no-audit --no-fund
      continueOnError: false
    windows:
      shell: pwsh
      run: npm install --os=linux --cpu=x64 --no-audit --no-fund
      continueOnError: false
  postprovision:
    posix:
      shell: sh
      run: ./infra/scripts/setuplocalenvironment.sh
      interactive: true
      continueOnError: false
    windows:
      shell: pwsh
      run: ./infra/scripts/setuplocalenvironment.ps1
      interactive: true
      continueOnError: false
  postdeploy:
    shell: sh
    run: echo "Deployment completed successfully"
    continueOnError: false
